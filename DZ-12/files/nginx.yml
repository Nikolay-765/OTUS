---
- name: NGINX | Install and configure NGINX
  hosts: web
  become: yes
  vars:
     nginx_listen_port: 8080

  tasks:
  - name: "system upgrade"
    ansible.builtin.apt:
      upgrade: safe
      update_cache: yes
    tags: 
      - system_upgrade

  - name: "NGINX | Install nginx"
    apt:
      name: nginx
      state: present
      update_cache: yes
    tags:
      - nginx_installation

  - name: "NGINX | Configuration nginx"
    template:
      src: templates/nginx.conf.j2
      dest: /etc/nginx/nginx.conf
    notify: reload nginx
    tags:
      - nginx_configuration

  handlers:
    - name: "reload nginx"
      service:
        name: nginx
        state: reloaded