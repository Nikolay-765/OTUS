---
- name: MAIN | Office routers configuration
  hosts: all
  gather_facts: yes
  become: yes

  tasks:
  - name: "Software installation"
    ansible.builtin.apt:
      name: "{{ packages }}"
      state: present
      update_cache: true
    vars:
      packages:
      - tcpdump
      - net-tools
    tags:
      - software_installation

  - name: Make Netplan configuration file
    copy:
      dest: /etc/netplan/60-vlan-config.yaml
      content: |
        network:
          version: 2
          ethernets:
            eth1:
              dhcp4: false
            eth2:
              dhcp4: false
          bonds:
            bond0:
              interfaces:
                - eth1
                - eth2
              addresses:
                - {{ bond_ip }}
              parameters:
                mode: active-backup
                mii-monitor-interval: 0
                arp-interval: 100
                arp-ip-targets:
                  - {{ neighbour_ip }}
                primary: eth1
                fail-over-mac-policy: active
                gratuitous-arp: 5
              nameservers:
                addresses: []
      mode: '0600'
    tags:
      - adapter_config

  - name: Apply config
    command: netplan apply
    tags:
      - adapter_config
